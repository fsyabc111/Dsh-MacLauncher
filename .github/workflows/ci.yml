name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Swift tests
        run: swift test
      - name: Service smoke checks
        run: swift run DshLauncherSmokeChecks
      - name: Xcode build
        run: |
          xcodebuild \
            -project DshMacLauncher.xcodeproj \
            -scheme DshMacLauncher \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build
