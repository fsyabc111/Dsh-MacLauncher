name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime bundle
        run: Scripts/build-runtime.sh dist
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
      - name: Archive application
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project DshMacLauncher.xcodeproj \
            -scheme DshMacLauncher \
            -archivePath "$RUNNER_TEMP/DshMacLauncher.xcarchive" \
            -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application'
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DshMacLauncher.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist Config/ExportOptions.plist
      - name: Create and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          mkdir "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/export/DSH Launcher.app" "$RUNNER_TEMP/dmg/DSH Launcher.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname 'DSH Launcher' -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO dist/DSH-Launcher.dmg
          xcrun notarytool submit dist/DSH-Launcher.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/DSH-Launcher.dmg
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" \
            dist/DSH-Launcher.dmg \
            dist/dsh-runtime-arm64.zip \
            dist/runtime-manifest.json \
            --clobber

