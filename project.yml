name: DshMacLauncher
options:
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  bundleIdPrefix: com.fsyabc111
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: false
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    CLANG_ENABLE_MODULES: true
configs:
  Debug: debug
  Release: release
targets:
  DshLauncherCore:
    type: framework
    platform: macOS
    sources:
      - Sources/DshLauncherCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fsyabc111.DshLauncherCore
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
  DshMacLauncher:
    type: application
    platform: macOS
    sources:
      - Sources/DshMacLauncher
      - Resources/Assets.xcassets
    dependencies:
      - target: DshLauncherCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: DSH Launcher
        CFBundleName: DSH Launcher
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 fsyabc111
        RuntimeManifestURL: https://github.com/fsyabc111/Dsh-MacLauncher/releases/latest/download/runtime-manifest.json
    entitlements:
      path: Resources/DshMacLauncher.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fsyabc111.DshMacLauncher
        PRODUCT_NAME: DSH Launcher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DshLauncherCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DshLauncherCoreTests
    dependencies:
      - target: DshLauncherCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fsyabc111.DshLauncherCoreTests
        GENERATE_INFOPLIST_FILE: true
  DshMacLauncherUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: DshMacLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fsyabc111.DshMacLauncherUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  DshMacLauncher:
    build:
      targets:
        DshLauncherCore: all
        DshMacLauncher: all
        DshLauncherCoreTests: [test]
        DshMacLauncherUITests: [test]
    test:
      targets:
        - DshLauncherCoreTests
        - DshMacLauncherUITests
    run:
      config: Debug
    archive:
      config: Release
